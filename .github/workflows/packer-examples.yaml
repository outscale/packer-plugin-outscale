name: Packer examples tests

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

on:
    pull_request:
        branches:
            - main
        paths:
            - "**.go"
            - "go.mod"
            - "go.sum"
            - "examples/**.pkr.hcl"
            - "examples/**.sh"
            - "examples/**.yml"
            - "scripts/run-examples.sh"
            - "GNUmakefile"
            - ".github/workflows/packer-examples.yaml"
    schedule:
        - cron: "30 02 * * *"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    examples_tests:
        runs-on:
            group: iac
            labels: [authenticated, oapi]
        steps:
            - name: 🔒🧹 Setup Vault & Frieza
              uses: outscale/.github/vault-frieza-clean@cc76c3e03f3c7a83a09914b1ed65b7fea5605fb8 # v1.5.1
              with:
                  vault_role: ${{ github.repository_owner }}-${{ github.event.repository.name }}
                  providers: outscale_oapi
                  bypass_deletion_protection: true
                  exclude_resource_types: access_key

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: "go.mod"

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.14"
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip

            - name: Install Ansible
              run: python3 -m pip install --upgrade ansible

            - name: Setup Packer
              uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
              with:
                  version: "1.16.3"

            - name: Run Packer examples
              run: ./scripts/run-examples.sh
