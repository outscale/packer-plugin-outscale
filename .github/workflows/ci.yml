name: Execute CI

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

on:
    pull_request:
        branches:
            - main
        paths:
            - "**.go"
            - "**.sum"
            - "**.mod"
            - "builder/**.go"
            - "datasource/**.sh"
            - "examples/**"
            - "scripts/run-examples.sh"
            - "GNUmakefile"
            - ".github/workflows/ci.yml"

permissions:
    contents: read
    id-token: write

jobs:
    check-code:
        runs-on: ubuntu-latest
        steps:
            - name: ⬇️ Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: ⬇️ Setup Go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: "go.mod"
            - name: Fmt
              run: |
                  go fmt ./...
                  echo "==> Checking that code complies with go fmt requirements..."
                  git diff --exit-code; if [ $? -eq 1 ]; then \
                  echo "Found files that are not fmt'ed."; \
                  echo "You can use the command: \`go fmt ./...\` to reformat code."; \
                  exit 1; \
                  fi
            - name: 🔎 Lint
              uses: outscale/goutils/.github/actions/lint@1bb3410dfa22c53e69de29f57671e668c4627690 # v1.0.4
            - name: Generation
              run: |
                  make generate
                  echo "==> Checking that auto-generated code is not changed..."
                  git diff --exit-code; if [ $? -eq 1 ]; then \
                     echo "Found diffs in go generated code."; \
                     echo "You can use the command: \`make generate\` to reformat code."; \
                     exit 1; \
                  fi

    test:
        needs: check-code
        runs-on:
            group: iac
            labels: [authenticated, oapi]
        steps:
            - name: 🔒🧹 Setup Vault & Frieza
              uses: outscale/.github/vault-frieza-clean@cc76c3e03f3c7a83a09914b1ed65b7fea5605fb8 # v1.5.1
              with:
                  vault_role: ${{ github.repository_owner }}-${{ github.event.repository.name }}
                  providers: outscale_oapi
                  bypass_deletion_protection: true
                  exclude_resource_types: access_key
            - name: ⬇️ Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: ⬇️ Setup Go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: "go.mod"
            - name: Run tests
              run: make test
            - name: Setup Packer
              uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
              with:
                  version: "1.16.3"
            - name: Run acceptance tests
              run: make testacc

    build:
        strategy:
            matrix:
                goos: ["linux", "darwin", "windows"]
        runs-on: ubuntu-latest
        steps:
            - name: ⬇️ Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: ⬇️ Setup Go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: "go.mod"
            - name: Build
              run: GOOS=${{matrix.goos}} go build -v -o packer-plugin-outscale_${{matrix.goos}}
            - name: Upload a Build Artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: packer-plugin-outscale_${{matrix.goos}}
                  path: ./packer-plugin-outscale_${{matrix.goos}}
